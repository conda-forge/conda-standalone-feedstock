schema_version: 1

context:
  version: "26.9.4.post1"
  conda_version: ${{ version | replace(".post1", "") }}
  conda_libmamba_solver_version: "26.7.0"
  libmambapy_version: "2.9.0"
  constructor_lower_bound: "3.17.1"
  menuinst_lower_bound: "2.5.2"
  python_version: "3.14.8"

package:
  name: conda-standalone
  version: ${{ version }}

source:
  - url: https://github.com/conda/conda-standalone/archive/${{ version }}.tar.gz
    sha256: 723306aabf14c7592d25cce887e943349f14786563fc6e5cf643622b45bb1685
    patches:
      - patches/0001-test-arm64-update-discovery.patch
  - url: https://github.com/conda/conda/archive/${{ conda_version }}.tar.gz
    sha256: 0b084bdaac353c6b1ce8aa6be860d9348eca2b6ba26a3741d615fd704641a1fd
    target_directory: conda_src
    patches:
      - ${{ SRC_DIR }}/src/conda_patches/0001-Rename-and-replace-entrypoint-stub-exe.patch
      - ${{ SRC_DIR }}/src/conda_patches/0002-Manipulate-PATH-directly-instead-of-_call_ing-conda.patch
      - ${{ SRC_DIR }}/src/conda_patches/0003-Restrict-search-paths.patch
      - ${{ SRC_DIR }}/src/conda_patches/0004-Fix-conda-run.patch

build:
  number: 1

requirements:
  build:
    - if: osx and x86_64
      then: ${{ stdlib('c') }}
    # The onefile activation regression affects Unix; Windows uses patch 0002.
    # https://github.com/conda/conda-standalone/issues/308
    - if: unix
      then: pyinstaller <6.22.1
      else: pyinstaller
    - python =${{ python_version }}
    - conda =${{ conda_version }}
    - if: win
      then: conda-launchers >=24.7.1
    - conda-package-handling >=2.3.0
    - conda-package-streaming >=0.9.0
    - menuinst >=${{ menuinst_lower_bound }}
    - conda-libmamba-solver =${{ conda_libmamba_solver_version }}
    - libmambapy =${{ libmambapy_version }}
    - archspec >=0.2.3
  ignore_run_exports:
    from_package:
      - ${{ stdlib('c') }}
  run_constraints:
    - constructor >=${{ constructor_lower_bound }}

tests:
  - files:
      source:
        - tests
      recipe:
        - if: win
          then: test_windows_entrypoints.py
    requirements:
      run:
        - conda =${{ conda_version }}
        - conda-build
        - pytest
        - menuinst =${{ menuinst_lower_bound }}
        - ruamel.yaml
    script:
      - pytest -vv -k "not test_uninstallation"
  - package_contents:
      strict: true
      files:
        - standalone_conda/conda.exe
        # These are added in the previous step
        - etc/conda/test-files/conda-standalone/*

about:
  license: LicenseRef-CondaStandalone
  license_file:
    - LICENSE
    - 3rd-party-licenses.json
  summary: Entry point and dependency collection for PyInstaller-based standalone conda.
  homepage: https://github.com/conda/conda-standalone

extra:
  recipe-maintainers:
    - marcoesters
    - jaimergp
    - jakirkham
    - msarahan
    - forrestwaters
    - nehaljwani
